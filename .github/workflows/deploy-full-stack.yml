name: Deploy Full Stack (Backend + Frontend)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    outputs:
      api_url: ${{ steps.get-api-url.outputs.api_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::338427534869:role/GitHubActionsBackendDeployRole
          aws-region: eu-north-1

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM Build
        run: sam build

      - name: SAM Deploy
        run: >
          sam deploy 
          --stack-name skolyn-api-backend
          --resolve-s3
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND
          --no-confirm-changeset
          --fail-on-empty-changeset

      - name: Get API URL
        id: get-api-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name skolyn-api-backend \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiBaseUrl`].OutputValue' \
            --output text \
            --region eu-north-1)
          echo "api_url=${API_URL}" >> $GITHUB_OUTPUT
          echo "API Gateway URL: ${API_URL}"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --cache .npm --prefer-offline

      - name: Build Frontend with API URL
        run: npm run build
        env:
          API_URL: ${{ needs.deploy-backend.outputs.api_url }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::338427534869:role/GitHubActionsFrontendDeployRole
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/skolyn-web/browser s3://skolyn-web-frontend-prod --delete --region eu-north-1

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID="E3D90FQ44PFI25"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --region eu-north-1

      - name: Test API Connectivity
        run: |
          API_URL="${{ needs.deploy-backend.outputs.api_url }}"
          echo "Testing API connectivity to: ${API_URL}/api/newsletter"
          curl -s -X POST "${API_URL}/api/newsletter" \
            -H "Content-Type: application/json" \
            -d '{"email":"test@github-actions.com"}' || echo "API test request sent"

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Backend API URL: ${{ needs.deploy-backend.outputs.api_url }}"
          echo "Frontend URL: https://d9985nvn93elk.cloudfront.net"
          echo "=========================================="

  verify-deployment:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: always()

    steps:
      - name: Deployment Status
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Full stack deployment successful!"
          else
            echo "❌ Deployment had issues. Check logs above."
            exit 1
          fi
