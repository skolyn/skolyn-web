name: Deploy Frontend to Amplify

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --cache .npm --prefer-offline

      - name: Build Frontend
        run: npm run build
        env:
          # API URL can be passed as environment variable during build if needed
          # This will be injected at runtime via Amplify env variables
          API_URL: ${{ secrets.AMPLIFY_API_URL || 'https://o9bsy5k3wl.execute-api.eu-north-1.amazonaws.com' }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::298882023743:role/GitHubActionsFrontendDeployRole
          aws-region: eu-north-1

      - name: Deploy to Amplify
        run: |
          # Install Amplify CLI
          npm install -g @aws-amplify/cli

          # Deploy frontend
          amplify deploy \
            --dir dist/skolyn-web/browser \
            --platform web \
            --no-confirm || true
        continue-on-error: true

      - name: Manual S3 Deploy (Fallback)
        run: |
          # If Amplify deployment doesn't work, deploy directly to S3
          aws s3 sync dist/skolyn-web/browser s3://skolyn-web-frontend-prod --delete

          # Invalidate CloudFront cache if applicable
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" || true
        continue-on-error: true

      - name: Deployment Status
        run: echo "Frontend deployment completed"
