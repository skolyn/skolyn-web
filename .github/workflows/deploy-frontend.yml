name: Deploy Frontend to S3 + CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --cache .npm --prefer-offline

      - name: Build Frontend
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::338427534869:role/GitHubActionsFrontendDeployRole
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/skolyn-web/browser s3://skolyn-web-frontend-prod --delete --region eu-north-1

      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID="E3D90FQ44PFI25"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --region eu-north-1

      - name: Deployment Status
        run: echo "✅ Frontend deployment to S3 + CloudFront completed!"
