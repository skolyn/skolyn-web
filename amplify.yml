version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/skolyn-web/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*

# Environment variables for the frontend build
env:
  variables:
    API_URL: $API_URL

